name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-go:
    runs-on: ubuntu-latest
    outputs:
      has-go: ${{ steps.check.outputs.has-go }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f "go.mod" ]; then
            echo "has-go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-go=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    needs: check-go
    if: needs.check-go.outputs.has-go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make tools
      - run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26']
    name: 'test (go ${{ matrix.go }})'
    runs-on: ubuntu-latest
    needs: check-go
    if: needs.check-go.outputs.has-go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make test

  build:
    runs-on: ubuntu-latest
    needs: [check-go, lint, test]
    if: needs.check-go.outputs.has-go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make build